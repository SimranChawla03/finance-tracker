<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FinanceTracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-container">

    <!-- LEFT PANEL -->
    <div class="auth-left">
      <div class="auth-left-logo">FinanceTracker</div>
      <h2>Welcome back.</h2>
      <p>Your financial data is waiting for you.</p>
      <ul class="auth-feature-list">
        <li>All your transactions in one place</li>
        <li>Real-time balance updates</li>
        <li>Income vs expense analytics</li>
        <li>Secure session management</li>
      </ul>
    </div>

    <!-- RIGHT: FORM -->
    <div class="auth-right">
      <div class="auth-card page-enter">

        <h3>Sign In</h3>
        <p class="auth-subtitle">Enter your credentials to continue</p>

        <div class="form-group">
          <label>Email Address</label>
          <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-box">
            <input id="loginPassword" type="password" placeholder="Your password" autocomplete="current-password">
            <button class="password-toggle" onclick="togglePassword('loginPassword')" type="button">👁</button>
          </div>
        </div>

        <span id="loginError" class="error-msg"></span>

        <button class="auth-submit" onclick="loginUser()">Sign In</button>

        <p class="auth-footer">
          Don't have an account? <a href="signup.html">Sign up</a>
        </p>

      </div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
